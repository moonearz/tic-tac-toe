<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tic-Tac-Toe</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            width: 310px;
            margin: 30px auto;
        }

        .square {
            font-size: 3rem;
            font-weight: bold;
            border: 1px solid #333;
            background: #f5f5f5;
            cursor: pointer;
        }

        .square:hover:enabled {
            background: #ddd;
        }

        .square:disabled {
            cursor: default;
            color: #111;
        }

        .new-game {
            font-size: 1rem;
            padding: 10px 20px;
        }
    </style>
</head>

<body>
    <h1>Tic-Tac-Toe</h1>

    {% if terminal %}
    	{% if winner is not none %}
        	<p>{{ winner.value }} wins!</p>
    	{% else %}
    		<p>It's a draw!</p>
    	{% endif %}
    {% else %}
    	<p>Your turn</p>
    {% endif %}

    <form method="post" action="{{ url_for('move') }}">
        <div class="board">
            {% for position in range(9) %}
                {% set value = board[position] %}

                <button
                    class="square"
                    type="submit"
                    name="position"
                    value="{{ position }}"
                    {% if value is not none or terminal %}disabled{% endif %}
                >
                    {{ value.value if value is not none else '' }}
                </button>
            {% endfor %}
        </div>
    </form>

    <form method="post" action="{{ url_for('new_game') }}">
        <button class="new-game" type="submit">New Game</button>
    </form>
</body>
</html>
